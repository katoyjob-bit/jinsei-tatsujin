<html lang="ja">
<head>

<title>人生の達人賞 作成ページ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6efe3;color:#4b2d18;font-family:Arial,"Yu Gothic",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:22px}h1{text-align:center;margin:0 0 5px}.lead{text-align:center;color:#765d48}
.grid{display:grid;grid-template-columns:310px 1fr;gap:20px;margin-top:20px}.card,.preview{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #0001}

canvas{width:100%;height:auto;display:block}.status{font-size:13px;text-align:center;color:#765d48;margin-top:8px}
@media(max-width:760px){.wrap{padding:14px}.grid{grid-template-columns:1fr}}

let photo=null;
function draw(){
ctx.clearRect(0,0,W,H);ctx.drawImage(art,0,0,W,H);
if(photo){
let s=Math.max(R*2/photo.width,R*2/photo.height),dw=photo.width*s,dh=photo.height*s;
ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();ctx.drawImage(photo,CX-dw/2,CY-dh/2,dw,dh);ctx.restore();
}
let n=nameInput.value.trim();
if(n){
ctx.save();ctx.fillStyle='rgba(247,178,154,.98)';ctx.fillRect(500,785,215,62);
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#4a2b1a';
ctx.font='bold 42px "Yu Mincho","Yu Gothic",serif';ctx.fillText(n,585,815,175);
ctx.font='32px "Yu Mincho","Yu Gothic",serif';ctx.fillText('様',690,815);ctx.restore();
}
save.disabled=!photo;status.textContent=photo?'プレビューに反映されています。':'写真を選択してください。';
}
art.onload=draw;
photoInput.onchange=e=>{
let f=e.target.files[0];if(!f)return;
let u=URL.createObjectURL(f),p=new Image();
p.onload=()=>{photo=p;URL.revokeObjectURL(u);draw()};p.src=u;
};
nameInput.oninput=draw;
save.onclick=()=>canvas.toBlob(blob=>{
let a=document.createElement('a'),n=(nameInput.value.trim()||'完成').replace(/[\\/:*?"<>|]/g,'_');
a.href=URL.createObjectURL(blob);a.download='人生の達人賞_'+n+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
},'image/png');
draw();
</script>
